<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-secondary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Jihad Miah</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="portfolio.html">Portfolio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="service.html">Service</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
          <a href="contact.html" class="btn btn-outline-success ms-3"
            >Hire Me</a
          >
        </div>
      </div>
    </nav>

    <section>
      <div class="container mt-5">
        <div class="row">
          <!-- Map Side -->
          <div class="col-md-6 mb-3">
            <h4>Our Location</h4>

            <iframe
              class="rounded-2"
              src="https://www.google.com/maps/embed?pb=!1m12!1m8!1m3!1d116835.83419891253!2d90.37834165927734!3d23.778747257202706!3m2!1i1024!2i768!4f13.1!2m1!1sgoogle%20map%20creative%20it%20institute!5e0!3m2!1sen!2sbd!4v1778257934356!5m2!1sen!2sbd"
              width="600"
              height="450"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>

          <!-- Form Side -->
          <div class="col-md-6">
            <h4>Contact Us</h4>

            <form id="contactForm">
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="Your Name"
                />
                <small class="text-danger" id="nameError"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="Your Email"
                />
                <small class="text-danger" id="emailError"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                  type="text"
                  id="phone"
                  class="form-control"
                  placeholder="Your Phone"
                />
                <small class="text-danger" id="phoneError"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="4"></textarea>
                <small class="text-danger" id="messageError"></small>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Send Message
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <section class="bg-body-secondary">
      <div class="container">
        <footer class="py-3 mt-4">
          <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item">
              <a href="/index.html" class="nav-link px-2 text-muted">Home</a>
            </li>
            <li class="nav-item">
              <a href="/about.html" class="nav-link px-2 text-muted">About</a>
            </li>
            <li class="nav-item">
              <a href="/portfolio.html" class="nav-link px-2 text-muted"
                >Portfolio</a
              >
            </li>
            <li class="nav-item">
              <a href="/service.html" class="nav-link px-2 text-muted"
                >Services</a
              >
            </li>
            <li class="nav-item">
              <a href="/contact.html" class="nav-link px-2 text-muted"
                >Contact</a
              >
            </li>
          </ul>
          <p class="text-center text-muted">© 2026 Company, Inc</p>
        </footer>
      </div>
    </section>

    <script src="/js/script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
